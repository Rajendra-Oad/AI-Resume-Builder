spring.application.name=ai-resume-builder
server.port=8080
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:6MB}
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:PT5S}
app.http.read-timeout=${HTTP_READ_TIMEOUT:PT10S}
spring.config.import=optional:file:./.env[.properties]
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Select exactly one provider: gemini (default) or openai.
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.ai.openai.model=${OPENAI_MODEL:gpt-5-mini}
app.ai.rate-limit.per-user-per-hour=${AI_RATE_LIMIT_PER_USER_PER_HOUR:20}
app.ai.budget.per-user-monthly-usd=${AI_BUDGET_PER_USER_MONTHLY_USD:2.00}
app.ai.cache.ttl-seconds=${AI_CACHE_TTL_SECONDS:900}
app.ai.pricing.gemini.input-per-million=${GEMINI_INPUT_USD_PER_MILLION:0.10}
app.ai.pricing.gemini.output-per-million=${GEMINI_OUTPUT_USD_PER_MILLION:0.40}
app.ai.pricing.openai.input-per-million=${OPENAI_INPUT_USD_PER_MILLION:0.15}
app.ai.pricing.openai.output-per-million=${OPENAI_OUTPUT_USD_PER_MILLION:0.60}
app.ai.redis.enabled=${AI_REDIS_ENABLED:false}
management.health.redis.enabled=${AI_REDIS_ENABLED:false}
app.ai.user-key-encryption-key=${USER_API_KEY_ENCRYPTION_KEY:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.issuer=${JWT_ISSUER:ai-resume-builder}
app.security.jwt.audience=${JWT_AUDIENCE:ai-resume-builder-web}
app.security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.security.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.security.secure-cookies=${APP_SECURE_COOKIES:false}
app.security.mail-from=${MAIL_FROM:no-reply@localhost}

# SMTP settings are kept in the ignored backend/.env file.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}
