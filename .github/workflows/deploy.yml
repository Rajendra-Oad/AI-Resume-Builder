name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to the selected branch HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm quality gate and revision
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$VERIFIED_SHA"
          elif [[ -n "$REQUESTED_SHA" ]]; then
            sha="$REQUESTED_SHA"
          else
            sha="$DEFAULT_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  manual-quality-gate:
    name: Verify manually selected revision
    if: github.event_name == 'workflow_dispatch'
    needs: authorize
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_resume_builder_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: integration-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U app_test -d ai_resume_builder_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode verify
      - name: Verify PostgreSQL migrations and workflows
        working-directory: backend
        env:
          IT_DB_URL: jdbc:postgresql://127.0.0.1:5432/ai_resume_builder_test
          IT_DB_USERNAME: app_test
          IT_DB_PASSWORD: integration-test-password
        run: mvn --batch-mode -Pintegration-test verify
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

  security-gate:
    name: Security release gate
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.manual-quality-gate.result == 'success' || needs.manual-quality-gate.result == 'skipped')
    needs: [authorize, manual-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --no-banner
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reject high or critical frontend vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Reject backend dependencies with CVSS 7 or higher
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn --batch-mode
          org.owasp:dependency-check-maven:12.2.2:check
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON
          -DdataDirectory="${GITHUB_WORKSPACE}/backend/.dependency-check-data"
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

  deploy-backend:
    name: Deploy backend to Render
    needs: [authorize, security-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger the exact verified commit
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"$COMMIT_SHA\",\"clearCache\":\"do_not_clear\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          deploy_id=$(jq --raw-output '.id // .deploy.id // empty' <<< "$response")
          if [[ -z "$deploy_id" ]]; then
            echo "Render did not return a deployment ID." >&2
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          for attempt in {1..60}; do
            response=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            status=$(jq --raw-output '.status // empty' <<< "$response")
            echo "Render deployment status: $status"
            if [[ "$status" == "live" ]]; then exit 0; fi
            if [[ "$status" =~ ^(build_failed|update_failed|canceled|deactivated)$ ]]; then exit 1; fi
            sleep 10
          done
          echo "Render deployment did not become live within 10 minutes." >&2
          exit 1

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: [authorize, security-gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pull Vercel production configuration
        run: npx vercel@58.4.4 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build Vercel production output
        run: npx vercel@58.4.4 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output
        run: npx vercel@58.4.4 deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"

  verify:
    name: Verify production
    needs: [authorize, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: Verify public production boundaries
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: bash scripts/operations/production-smoke.sh
