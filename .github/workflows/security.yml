name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source=/github/workspace --redact --verbose --no-banner

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  backend-dependencies:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set Dependency-Check cache key
        id: dependency-check-cache-key
        run: echo "date=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency-Check vulnerability data
        id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/.dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ steps.dependency-check-cache-key.outputs.date }}
          restore-keys: |
            dependency-check-${{ runner.os }}-12.2.2-
      - name: Fail on dependencies with CVSS 7 or higher
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn --batch-mode
          org.owasp:dependency-check-maven:12.2.2:check
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON
          -DdataDirectory="${GITHUB_WORKSPACE}/backend/.dependency-check-data"
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
      - name: Save Dependency-Check vulnerability data
        if: always() && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: backend/.dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ steps.dependency-check-cache-key.outputs.date }}
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-reports
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
