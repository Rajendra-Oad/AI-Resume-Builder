name: ai-resume-builder-production

services:
  backend:
    # The backend image is built without copying backend/.env into any layer.
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ai-resume-builder-backend:latest
    restart: unless-stopped

    # Host networking intentionally preserves DB_URL=jdbc:postgresql://localhost:5432:
    # the container reaches the existing EC2-hosted PostgreSQL service directly.
    network_mode: host
    env_file:
      - ../backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Conservative defaults for the 1 GiB t3.micro; override in backend/.env
      # only after observing memory usage.
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=65
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -XX:+ExitOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp
        -Djava.security.egd=file:/dev/urandom
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/actuator/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    # This image runs workers as an unprivileged user and listens on high
    # container ports, which Docker publishes as host ports 80 and 443.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    user: "101:101"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_TLS_CERTIFICATE:?Set NGINX_TLS_CERTIFICATE in docker/.env}:/etc/nginx/tls/fullchain.pem:ro
      - ${NGINX_TLS_PRIVATE_KEY:?Set NGINX_TLS_PRIVATE_KEY in docker/.env}:/etc/nginx/tls/privkey.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/nginx-health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
