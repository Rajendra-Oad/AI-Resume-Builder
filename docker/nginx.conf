# Production reverse proxy for the Vercel-hosted frontend and Spring Boot API.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"request_id":"$request_id"}';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 6m;

  # Preserve WebSocket upgrade support without forcing upgrade headers on every
  # ordinary HTTP request.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Port 8080 is published as host port 80.
  server {
    listen 8080;
    server_name _;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Port 8443 is published as host port 443.
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "healthy\n";
    }

    location = /actuator/health {
      proxy_pass http://host.docker.internal:8080/actuator/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /api/ {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # The UI is already deployed on Vercel; keep the backend hostname useful
    # without shipping a second, potentially stale frontend build.
    location / {
      return 302 https://ai-resume-builder-india.vercel.app$request_uri;
    }
  }
}
